<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RaktDurg — Digital Blood Bank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f1f4f8;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        z-index: 9999;
      }
      #boot-splash img { width: 72px; height: 72px; }
      #boot-splash p { color: #6b7280; font-size: 14px; margin-top: 12px; }
      #boot-splash .spin {
        margin-top: 20px;
        width: 24px;
        height: 24px;
        border: 2px solid #dc2626;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <img src="/logo.svg" alt="RaktDurg" />
      <p>Loading RaktDurg…</p>
      <div class="spin"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const root = document.getElementById('root');
        const splash = document.getElementById('boot-splash');
        const obs = new MutationObserver(() => {
          if (root && root.children.length > 0 && splash) {
            splash.remove();
            obs.disconnect();
          }
        });
        if (root) obs.observe(root, { childList: true });
      });
    </script>
  </body>
</html>
