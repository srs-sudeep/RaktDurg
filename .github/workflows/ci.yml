name: CI / CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-production:
    name: Deploy · Production
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - name: Copy application source to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "backend,web,infra"
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 0
      - name: Deploy on GCE host
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            mkdir -p "${{ secrets.DEPLOY_PATH }}/infra/nginx" "${{ secrets.DEPLOY_PATH }}/infra/gce"
            cat > "${{ secrets.DEPLOY_PATH }}/infra/.env" <<'EOF'
            ${{ secrets.PROD_ENV_FILE }}
            EOF
            chmod +x "${{ secrets.DEPLOY_PATH }}/infra/gce/deploy.sh"
            APP_DIR="${{ secrets.DEPLOY_PATH }}" \
            "${{ secrets.DEPLOY_PATH }}/infra/gce/deploy.sh"
