name: CI / CD

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-production:
    name: Deploy · Production
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH access
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Sync application source to VM
        run: |
          tar czf - backend web infra | \
            ssh -i ~/.ssh/id_ed25519 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "tar xzf - -C '${{ secrets.DEPLOY_PATH }}'"
      - name: Deploy on GCE host
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" <<'EOF'
          set -euo pipefail
          mkdir -p "${{ secrets.DEPLOY_PATH }}/infra/nginx" "${{ secrets.DEPLOY_PATH }}/infra/gce"
          cat > "${{ secrets.DEPLOY_PATH }}/infra/.env" <<'ENVEOF'
          ${{ secrets.PROD_ENV_FILE }}
          ENVEOF
          chmod +x "${{ secrets.DEPLOY_PATH }}/infra/gce/deploy.sh"
          APP_DIR="${{ secrets.DEPLOY_PATH }}" "${{ secrets.DEPLOY_PATH }}/infra/gce/deploy.sh"
          EOF
