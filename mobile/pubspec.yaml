name: rakt_durg_mobile
description: RAKT Durg — Donor & Camp Capture App
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.2.0

  # HTTP
  dio: ^5.7.0
  retrofit: ^4.4.1

  # Local storage (offline)
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Barcode (manual entry + QR render; camera scan needs a physical device plugin)
  qr_flutter: ^4.1.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  connectivity_plus: ^6.1.0
  json_annotation: ^4.9.0
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png
  adaptive_icon_background: "#1f2937"
  adaptive_icon_foreground: assets/app_icon.png

flutter_native_splash:
  color: "#f9fafb"
  image: assets/splash.png
  android_12:
    color: "#f9fafb"
    image: assets/splash.png

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo.svg
    - assets/app_icon.png
    - assets/splash.png
    - assets/partners/ibitf.jpeg
    - assets/partners/recogx.webp
    - assets/partners/iit_bhilai.svg
