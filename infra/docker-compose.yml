services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://rakt:rakt@db:5432/rakt_durg
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://rakt:rakt@db:5432/rakt_durg
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../backend:/app
    command: alembic upgrade head
    profiles:
      - migrate

  demo-seed:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://rakt:rakt@db:5432/rakt_durg
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ../backend:/app
    command: python -m seed.demo_seed
    profiles:
      - demo

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://rakt:rakt@db:5432/rakt_durg
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app
    command: celery -A app.tasks.celery_app worker --loglevel=info -Q default

  beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://rakt:rakt@db:5432/rakt_durg
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    depends_on:
      - worker
    volumes:
      - ../backend:/app
    command: celery -A app.tasks.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rakt
      POSTGRES_PASSWORD: rakt
      POSTGRES_DB: rakt_durg
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rakt -d rakt_durg"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@rakt.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    profiles:
      - tools

volumes:
  postgres_data:
